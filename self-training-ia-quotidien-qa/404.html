ire la stratégie de test d'une fonctionnalité\",\"link\":\"/qa/m2-strategie-test\"},{\"text\":\"M3 · Concevoir les cas de test\",\"link\":\"/qa/m3-cas-de-test\"},{\"text\":\"M4 · Générer des données de test\",\"link\":\"/qa/m4-donnees-de-test\"},{\"text\":\"M5 · Passer du cas de test au scénario automatisé\",\"link\":\"/qa/m5-scenario-automatise\"},{\"text\":\"M6 · Qualifier et rédiger une anomalie\",\"link\":\"/qa/m6-anomalie\"},{\"text\":\"M7 · Choisir la campagne de non-régression\",\"link\":\"/qa/m7-non-regression\"},{\"text\":\"M8 · Rendre compte de la qualité et préparer le go / no-go\",\"link\":\"/qa/m8-bilan-go-no-go\"}]},{\"text\":\"Fin\",\"items\":[{\"text\":\"Fin du parcours\",\"link\":\"/qa/fin\"}]}]},\"aside\":false,\"selfTraining\":{\"accueil\":{\"cle\":\"ia-qa-v2\",\"marque\":\"L'IA au quotidien\",\"surtitre\":\"Auto-formation · QA\",\"titre\":\"L'IA au quotidien en QA\",\"lede\":\"Le départ express de Lanterne, de la user story au go / no-go, mission après mission : l'IA prépare et contredit, toi tu décides.\",\"image\":\"/images/accueil.webp\",\"alt\":\"Le ou la QA de Lanterne (cheveux noirs bouclés et courts, veste en jean, badge au tour de cou) coche une liste de cas de test devant un grand écran de smartphone, un tableau de bord vert et orange derrière ; une petite IA, un orbe magenta avec un visage, flotte à son épaule et pointe un cas oublié.\",\"etapes\":[\"Cette page te guide\",\"Ton assistant IA ouvert à côté\",\"Une mission, un créneau\"],\"pied\":[\"Documents fictifs. Ta progression reste dans ce navigateur.\"]},\"parcours\":[{\"id\":\"QA\",\"nom\":\"Parcours QA\",\"titre\":\"L'IA dans le quotidien du QA\",\"public\":\"Pour les testeurs, testeuses et QA en poste, en test manuel ou automatisé. Tu testes le départ express de Lanterne en trois chapitres : préparer (analyser la user story, bâtir la stratégie, concevoir les cas et leurs données), outiller (automatiser un scénario), exécuter et décider (qualifier une anomalie, choisir la non-régression, rendre compte avant le go / no-go).\",\"prerequis\":\"Être testeur, testeuse ou QA en poste. Aucun prérequis technique ; les modules d'automatisation se lisent sans savoir coder.\",\"requiert\":null,\"duree\":240,\"finAussi\":\"Dès ta prochaine user story : fais lister par l'IA ses ambiguïtés et ses critères non testables, puis pose toi-même les questions au PO. Et avant de dire qu'une campagne est verte, écris ce qui n'a pas été testé.\",\"dir\":\"qa\",\"modules\":[{\"id\":\"M0\",\"titre\":\"Démarrage : travailler avec l'IA sans perdre la main\",\"duree\":15,\"badge\":{\"nom\":\"Premier cas\",\"devise\":\"Je teste, l'IA m'assiste.\"},\"lien\":\"/qa/m0-demarrage\",\"exercice\":{\"id\":\"QA.M0\",\"seul\":true,\"fichiers\":[],\"checkpoint\":\"Écris ta demande réécrite. Lequel des cinq réflexes as-tu eu le plus de mal à appliquer ?\"},\"grille\":[\"Ma demande donne un contexte précis et nomme le document que je joins.\",\"Elle fixe le format des cas de test et leur nombre.\",\"Elle interdit d'inventer et demande les questions à poser.\",\"Elle ne délègue ni la priorité ni le « prêt à livrer ».\",\"Je sais comment je vais vérifier la réponse.\"]},{\"id\":\"M1\",\"titre\":\"Analyser une user story avant de la tester\",\"duree\":30,\"badge\":{\"nom\":\"Lecteur sans pitié\",\"devise\":\"Un critère se teste ou se discute.\"},\"lien\":\"/qa/m1-analyse-user-story\",\"exercice\":{\"id\":\"QA.M1\",\"seul\":false,\"fichiers\":[\"us-LAN-117-minibar-confirmation.md\",\"fiche-depart-express-v2.md\"],\"checkpoint\":\"Combien de critères d'acceptation ne sont pas testables tels qu'ils sont écrits, et quelle question poses-tu au PO pour chacun ?\"},\"grille\":[\"Chaque critère non testable est identifié (CA-n) avec la raison : pas de seuil, mot subjectif.\",\"Le « rapidement » devient une question au PO, avec le seuil de la fiche à confirmer, pas un seuil inventé.\",\"Le cas « écart facturé, paiement refusé » est signalé comme absent.\",\"Mes questions sont numérotées, adressées à Yann, une décision par question.\",\"Je sais ce qui bloque la définition de prêt et ce qui peut attendre.\"]},{\"id\":\"M2\",\"titre\":\"Construire la stratégie de test d'une fonctionnalité\",\"duree\":30,\"badge\":{\"nom\":\"Stratège du risque\",\"devise\":\"Le plus grave d'abord, le reste écrit.\"},\"lien\":\"/qa/m2-strategie-test\",\"exercice\":{\"id\":\"QA.M2\",\"seul\":false,\"fichiers\":[\"fiche-depart-express-v2.md\",\"architecture-depart-express.md\",\"incidents-production-paiement.csv\"],\"checkpoint\":\"Quel est ton premier risque, pourquoi, et quel risque proposé par l'IA as-tu écarté faute de source ?\"},\"grille\":[\"Chaque risque cite sa source : une règle DE, un composant ou des incidents.\",\"Aucun risque ne repose sur un composant absent de l'architecture.\",\"Le paiement est classé par la gravité de ses incidents, pas par leur nombre.\",\"Chaque risque a un niveau de test et une profondeur (léger, standard, approfondi).\",\"Je sais ce que je ne teste pas, et je peux dire pourquoi.\"]},{\"id\":\"M3\",\"titre\":\"Concevoir les cas de test\",\"duree\":30,\"badge\":{\"nom\":\"Maître des limites\",\"devise\":\"Un bug se cache à la frontière.\"},\"lien\":\"/qa/m3-cas-de-test\",\"exercice\":{\"id\":\"QA.M3\",\"seul\":false,\"fichiers\":[\"regles-pre-autorisation.md\"],\"checkpoint\":\"Combien de cas gardes-tu, et lesquels as-tu écartés parce qu'ils ne reposent sur aucune règle du document ?\"},\"grille\":[\"Les valeurs limites sont au bon endroit : 480,00 € est couvert, 480,01 € ne l'est pas ; 167 h 59 est valide, 168 h 00 est expirée.\",\"La table de décision a ses 8 combinaisons, dont « expirée et insuffisante ».\",\"Aucun cas ne repose sur une règle absente du document (tolérance, remise, prolongation).\",\"Le résultat attendu du cas « sinon » est « Réglez votre note au comptoir » au sprint 16.\",\"Chaque cas cite la règle RP qu'il vérifie.\",\"Je sais quels cas je retiens en premier, et pourquoi.\"]},{\"id\":\"M4\",\"titre\":\"Générer des données de test\",\"duree\":25,\"badge\":{\"nom\":\"Fabricant de jeux\",\"devise\":\"Un jeu de données se vérifie ligne à ligne.\"},\"lien\":\"/qa/m4-donnees-de-test\",\"exercice\":{\"id\":\"QA.M4\",\"seul\":false,\"fichiers\":[\"besoin-donnees-test.md\",\"jeu-donnees-genere.csv\"],\"checkpoint\":\"Quel cas du besoin manque au jeu, quelles lignes sont incohérentes, et quelle carte n'est pas une carte de test ?\"},\"grille\":[\"Je repère le cas B-04 absent : aucune ligne à 480,00 € pour une pré-autorisation de 480,00 €.\",\"Je repère la ligne T-13 : départ le 13 octobre, avant l'arrivée du 15.\",\"Je repère la ligne T-10 : un séjour de groupe marqué « Encaissé sur la pré-autorisation » au lieu de « Présentez-vous à la réception ».\",\"Je repère la ligne T-14 : la carte 4111 1111 1111 1111 n'est pas dans la plage 9999 0000 0000 00NN.\",\"Je ne corrige rien en silence, et je demande à l'IA de régénérer seulement ce qui manque ou ce qui est faux.\"]},{\"id\":\"M5\",\"titre\":\"Passer du cas de test au scénario automatisé\",\"duree\":30,\"badge\":{\"nom\":\"Gardien du patrimoine\",\"devise\":\"Un test qui passe toujours ne protège rien.\"},\"lien\":\"/qa/m5-scenario-automatise\",\"exercice\":{\"id\":\"QA.M5\",\"seul\":false,\"fichiers\":[\"cas-de-test-depart-express.md\",\"scenario-genere-depart-express.feature\"],\"checkpoint\":\"Quelle étape du scénario généré ne vérifie rien, et que devrait-elle vérifier ?\"},\"grille\":[\"Je repère l'étape « le paiement est enregistré », qui ne contient aucune vérification.\",\"Je repère l'attente fixe de 5 secondes et je propose d'attendre un résultat plutôt qu'une durée.\",\"Je repère le test qui passe toujours (« la page s'affiche ») et je dis ce qu'il devrait vérifier.\",\"Je repère le cas CT-04 (séjour de groupe) sans scénario.\",\"Je dis ce que j'accepte, ce que je fais corriger et ce que je refuse dans le patrimoine de tests.\"]},{\"id\":\"M6\",\"titre\":\"Qualifier et rédiger une anomalie\",\"duree\":25,\"badge\":{\"nom\":\"Reproductible\",\"devise\":\"Un fait se prouve, une cause se suppose.\"},\"lien\":\"/qa/m6-anomalie\",\"exercice\":{\"id\":\"QA.M6\",\"seul\":false,\"fichiers\":[\"logs-paiement-sprint-16.txt\",\"notes-session-test.md\"],\"checkpoint\":\"Quelle sévérité proposes-tu pour l'anomalie, et quel fait t'empêche de la déclarer bloquante ?\"},\"grille\":[\"Le titre dit ce qui est observé, pas la cause.\",\"Les étapes, le résultat attendu (avec la règle DE-3) et le résultat observé sont séparés.\",\"La reproductibilité est chiffrée (2 fois sur 2) et les cas qui fonctionnent sont cités.\",\"La cause est une piste à vérifier, pas un fait ; la durée de 10 jours est écartée par le journal.\",\"La sévérité est justifiée par l'échelle de l'équipe et la priorité est laissée au PO.\",\"Aucune coordonnée de client dans le ticket.\"]},{\"id\":\"M7\",\"titre\":\"Choisir la campagne de non-régression\",\"duree\":30,\"badge\":{\"nom\":\"Cartographe d'impact\",\"devise\":\"Ce que je ne rejoue pas, je l'écris.\"},\"lien\":\"/qa/m7-non-regression\",\"exercice\":{\"id\":\"QA.M7\",\"seul\":false,\"fichiers\":[\"merge-requests-sprint-16.md\",\"referentiel-tests-regression.csv\"],\"checkpoint\":\"Quels tests rejoues-tu alors qu'aucun titre de merge request ne les nomme, et qu'est-ce qui les désigne ?\"},\"grille\":[\"Mon analyse d'impact part des modules modifiés, pas des titres de tickets.\",\"Le module partagé et tous ses consommateurs sont dans ma sélection.\",\"La merge request en brouillon n'est pas dans le périmètre.\",\"Le test instable est rejoué et signalé, jamais compté comme une preuve.\",\"Ma campagne tient dans le temps disponible.\",\"J'ai écrit ce que je ne rejoue pas, et pourquoi.\"]},{\"id\":\"M8\",\"titre\":\"Rendre compte de la qualité et préparer le go / no-go\",\"duree\":25,\"badge\":{\"nom\":\"Voix du comité\",\"devise\":\"Je recommande, le comité décide.\"},\"lien\":\"/qa/m8-bilan-go-no-go\",\"exercice\":{\"id\":\"QA.M8\",\"seul\":false,\"fichiers\":[\"resultats-campagne-sprint-16.csv\",\"anomalies-ouvertes.csv\",\"referentiel-tests-regression.csv\"],\"checkpoint\":\"Quel est ton taux de réussite, sur quel nombre de tests, et quelle anomalie mets-tu en tête de ton bilan ?\"},\"grille\":[\"Mon taux de réussite dit sur combien de tests il est calculé.\",\"Le périmètre non testé est écrit à côté du taux.\",\"L'anomalie bloquante est la première chose qu'on lit.\",\"Les anomalies sont comptées par sévérité, pas en vrac.\",\"Ma recommandation a des conditions, et je ne présente pas la décision comme prise.\"]}]}]}},\"locales\":{},\"scrollOffset\":134,\"cleanUrls\":true}");</script>
