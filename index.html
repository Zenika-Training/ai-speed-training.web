<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formations IA — Zenika</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* look of training.zenika.com: pastel background, white cards, Montserrat titles,
       outlined category pills, black pill buttons */
    :root { --magenta: #c41e62; --gradient: linear-gradient(90deg, #c41e62 0%, #e1203f 100%); --ink: #1a202c; --text: #4a5568; --line: #e2e8f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Nunito, system-ui, sans-serif; color: var(--text); background: radial-gradient(60% 50% at 0% 0%, #fde4ee 0%, transparent 100%), radial-gradient(60% 50% at 100% 10%, #e1e8ff 0%, transparent 100%), #fafbfd; }
    header, main { max-width: 1400px; margin: 0 auto; padding-left: clamp(16px, 4vw, 24px); padding-right: clamp(16px, 4vw, 24px); }
    header { padding-top: 24px; }
    header img { display: block; height: 44px; }
    .hero { margin: 48px 24px 8px; text-align: center; }
    .hero h1 { margin: 0; color: var(--ink); font-family: Montserrat, sans-serif; font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; letter-spacing: -.01em; }
    .hero p { margin: 12px 0 0; font-size: 1.1rem; }
    main { padding-bottom: 64px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 32px; }
    .toolbar[hidden], [hidden] { display: none !important; }
    #search { flex: 1 1 260px; min-width: 0; padding: 11px 18px; border: 1.5px solid var(--line); border-radius: 999px; font: inherit; color: var(--ink); background: #fff; }
    #search:focus { outline: none; border-color: var(--ink); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filters button { --c: var(--ink); padding: 7px 16px; border: 2px solid var(--c); border-radius: 48px; background: #fff; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
    .filters button[aria-pressed="true"] { background: var(--c); color: #fff; }
    .group { margin-top: 32px; }
    .group > h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; color: var(--ink); font-family: Montserrat, sans-serif; font-size: 1.1rem; }
    .group > h2::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    /* fluid grid: a card never gets narrower than its three buttons on one line (410px),
       the grid drops a column instead; min() keeps one full-width column on phones */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(410px, 100%), 1fr)); gap: 24px; }
    .card { position: relative; display: flex; flex-direction: column; padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 14px 30px rgb(146 146 146 / .14); }
    .card h3 { margin: 4px 0 10px; color: var(--ink); font-family: Montserrat, sans-serif; font-size: 1.2rem; font-weight: 700; line-height: 1.3; }
    .card p { margin: 0 0 10px; line-height: 1.5; }
    .eyebrow { font-family: Montserrat, sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--magenta); }
    .card:has(.duration) .eyebrow { padding-right: 84px; }
    .duration { position: absolute; top: 18px; right: 18px; display: flex; align-items: center; gap: 5px; margin: 0 !important; padding: 5px 12px 5px 10px; border-radius: 999px; background: var(--gradient); color: #fff; font-family: Montserrat, sans-serif; font-size: .85rem; font-weight: 700; line-height: 1.2; white-space: nowrap; }
    .duration svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
    .group--archives .eyebrow { color: var(--text); }
    .group--archives .duration { background: #a0aec0; }
    .tag { color: var(--text); }
    .meta { font-size: .85rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
    .chips li { padding: 2px 12px; border: 2px solid var(--c); border-radius: 48px; color: var(--ink); font-size: .8rem; font-weight: 600; }
    .group--archives .chips li { --c: #a0aec0 !important; }
    .empty { margin-top: 32px; text-align: center; }
    .links { margin-top: auto !important; display: flex; flex-wrap: wrap; gap: 8px; }
    .links a { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border: 1.5px solid var(--ink); border-radius: 64px; white-space: nowrap; background: #fff; color: var(--ink); font-weight: 700; text-decoration: none; }
    .links a:first-child { padding: 5px 5px 5px 18px; border-color: #000; background: #000; color: #fff; }
    .links a:hover { background: var(--ink); color: #fff; }
    .links a:first-child:hover { background: var(--magenta); border-color: var(--magenta); }
    .downloads { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 14px 0 0 !important; padding-top: 12px; border-top: 1px solid var(--line); font-size: .85rem; font-weight: 700; color: var(--text); }
    .downloads svg { width: 16px; height: 16px; margin-right: -8px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .downloads a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--magenta); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .downloads a:hover { color: var(--magenta); }
    .gate { max-width: 420px; margin: 40px auto 0; padding: 28px; border-radius: 16px; background: #fff; box-shadow: 0 14px 30px rgb(146 146 146 / .14); }
    .gate label { display: block; margin-bottom: 10px; color: var(--ink); font-family: Montserrat, sans-serif; font-weight: 700; }
    .gate-row { display: flex; gap: 8px; }
    .gate input { flex: 1; min-width: 0; padding: 10px 16px; border: 1.5px solid var(--line); border-radius: 999px; font: inherit; color: var(--ink); }
    .gate input:focus { outline: none; border-color: var(--ink); }
    .gate button { padding: 10px 20px; border: 0; border-radius: 64px; background: #000; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .gate button:hover { background: var(--magenta); }
    .gate-error { margin: 10px 0 0; color: var(--magenta); font-weight: 600; }
    .arrow { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #000; }
    .arrow svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <header><img src="./zenika-logo.svg" alt="Zenika"></header>
  <div class="hero"><h1>Formations IA</h1><p>Speed trainings et ateliers Zenika : slides, handouts et cheat sheets.</p></div>
  <main>
    <form class="gate" hidden>
      <label for="password">Mot de passe</label>
      <div class="gate-row">
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit">Entrer</button>
      </div>
      <p class="gate-error" hidden>Mot de passe incorrect.</p>
    </form>
  </main>
  <script>
    function initFilters() {
      const toolbar = document.querySelector('.toolbar')
      const search = document.getElementById('search')
      const buttons = [...document.querySelectorAll('.filters button')]
      const cards = [...document.querySelectorAll('.card')]
      const normalize = text => text.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase()
      const params = new URLSearchParams(location.search)
      let category = buttons.some(b => b.dataset.category === params.get('categorie')) ? params.get('categorie') : ''
      search.value = params.get('q') ?? ''
  
      function apply() {
        const words = normalize(search.value).split(/\s+/).filter(Boolean)
        for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.category === category))
        for (const card of cards) {
          const inCategory = !category || JSON.parse(card.dataset.categories).includes(category)
          card.hidden = !inCategory || !words.every(w => card.dataset.search.includes(w))
        }
        for (const group of document.querySelectorAll('.group'))
          group.hidden = !group.querySelector('.card:not([hidden])')
        document.querySelector('.empty').hidden = cards.some(c => !c.hidden)
        const next = new URLSearchParams()
        if (category) next.set('categorie', category)
        if (search.value.trim()) next.set('q', search.value.trim())
        history.replaceState(null, '', next.size ? `?${next}` : location.pathname)
      }
  
      buttons.forEach(b => b.addEventListener('click', () => { category = b.dataset.category; apply() }))
      search.addEventListener('input', apply)
      toolbar.hidden = false
      apply()
    }

    const storageKey = 'zenika-pages-key'
    const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0))
    const form = document.querySelector('.gate')

    async function unlock(key) {
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.data))
      document.querySelector('main').innerHTML = new TextDecoder().decode(plain)
      initFilters()
    }
    async function deriveKey(password) {
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: new TextEncoder().encode("zenika-ai-speed-training"), iterations: 310000, hash: 'SHA-256' },
        material, { name: 'AES-GCM', length: 256 }, true, ['decrypt'])
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      try {
        const key = await deriveKey(document.getElementById('password').value)
        await unlock(key)
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key))
        try { localStorage.setItem(storageKey, btoa(String.fromCharCode(...raw))) } catch {}
      }
      catch {
        form.querySelector('.gate-error').hidden = false
      }
    })

    ;(async () => {
      let stored = null
      try { stored = localStorage.getItem(storageKey) } catch {}
      try { await unlock(await crypto.subtle.importKey('raw', bytes(stored), 'AES-GCM', false, ['decrypt'])) }
      catch {
        // no key yet, or a key of an older password: ask for the password
        try { localStorage.removeItem(storageKey) } catch {}
        form.hidden = false
        document.getElementById('password').focus()
      }
    })()
  </script>
