efing : travailler avec l'IA sans perdre la main\",\"duree\":10,\"badge\":{\"nom\":\"Briefeur\",\"devise\":\"Je donne à l'IA un vrai brief.\"},\"lien\":\"/sm/m0-demarrage\",\"exercice\":{\"id\":\"SM.M0\",\"seul\":true,\"fichiers\":[],\"checkpoint\":\"Écris ta demande réécrite. Laquelle des cinq briques (rôle, contexte, tâche, format, règles) as-tu eu le plus de mal à écrire ?\"},\"grille\":[\"Ma demande donne un rôle à l'IA.\",\"Elle décrit la situation de l'équipe en quelques faits.\",\"Elle demande plusieurs options plutôt qu'une.\",\"Elle fixe le format et la durée de la rétro.\",\"Elle interdit d'inventer et demande les questions à me poser.\",\"Elle laisse le choix du format à moi, et les actions à l'équipe.\"]},{\"id\":\"M1\",\"titre\":\"Préparer une rétro qui sort de l'habitude\",\"duree\":20,\"badge\":{\"nom\":\"Facilitateur\",\"devise\":\"Je sors l'équipe de ses habitudes.\"},\"lien\":\"/sm/m1-preparer-retro\",\"exercice\":{\"id\":\"SM.M1\",\"seul\":false,\"fichiers\":[\"notes-sprint-16-sm.md\",\"historique-retros.md\"],\"checkpoint\":\"Quels sont les trois formats que tu retiens, lequel choisis-tu, et pourquoi pas « Start / Stop / Continue » ?\"},\"grille\":[\"Mes trois formats sont différents des quatre dernières rétros.\",\"Mon choix tient compte de la fatigue de l'équipe.\",\"L'action du sprint 14 sur le Daily est reprise en début de rétro.\",\"Aucune action n'est décidée dans ma préparation.\",\"Mon déroulé fait 60 minutes en tout.\"]},{\"id\":\"M2\",\"titre\":\"Synthétiser la rétro avec un regard neuf\",\"duree\":20,\"badge\":{\"nom\":\"Œil neuf\",\"devise\":\"Je vois le signal faible.\"},\"lien\":\"/sm/m2-synthese-retro\",\"exercice\":{\"id\":\"SM.M2\",\"seul\":false,\"fichiers\":[\"post-its-retro-sprint-16.md\"],\"checkpoint\":\"Combien de post-its par thème, et où as-tu rangé le post-it « Je n'ose pas dire quand je bloque » ?\"},\"grille\":[\"Les comptes par thème sont justes et totalisent 24.\",\"Le post-it isolé sur la sécurité psychologique est présent, tel quel.\",\"Aucun post-it n'a changé de sens en étant reformulé.\",\"Mes deux actions sont des propositions, formulées en SMART.\",\"Je les soumets à l'équipe : rien n'est présenté comme décidé.\"]},{\"id\":\"M3\",\"titre\":\"Relancer un Daily qui s'essouffle\",\"duree\":15,\"badge\":{\"nom\":\"Gardien du Daily\",\"devise\":\"Je rends le Daily à l'équipe.\"},\"lien\":\"/sm/m3-daily\",\"exercice\":{\"id\":\"SM.M3\",\"seul\":false,\"fichiers\":[\"observations-daily-sprint-17.md\"],\"checkpoint\":\"Quel obstacle revient plusieurs jours de suite, et lequel de tes 5 changements proposes-tu à l'équipe en premier, avec quelle intention ?\"},\"grille\":[\"J'ai repéré l'obstacle qui revient trois jours de suite (jours 4, 5 et 6), malgré ses formulations différentes.\",\"Aucune phrase de ma réponse n'évalue, ne classe ou ne compare une personne.\",\"Chaque changement a une intention écrite et se teste sur une durée courte.\",\"Aucun changement ne supprime le Daily ni ne devient une règle imposée.\",\"Je présente les changements comme des expériences que l'équipe accepte, modifie ou refuse.\"]},{\"id\":\"M4\",\"titre\":\"Préparer la Review et synthétiser les retours pour le backlog\",\"duree\":25,\"badge\":{\"nom\":\"Passeur\",\"devise\":\"Aucun retour ne se perd.\"},\"lien\":\"/sm/m4-sprint-review\",\"exercice\":{\"id\":\"SM.M4\",\"seul\":false,\"fichiers\":[\"review-sprint-17-elements.md\",\"review-sprint-17-retours.md\"],\"checkpoint\":\"Comment présentes-tu LAN-122 dans ton déroulé, et quels retours as-tu regroupés en propositions que Yann tranchera ?\"},\"grille\":[\"Mon déroulé de 45 minutes montre LAN-122 comme non terminé, avec ce qui manque à la Definition of Done.\",\"Mes questions attendues incluent la date de LAN-122, sans promesse de ma part.\",\"Chacun des 11 retours se retrouve dans un regroupement.\",\"Le retour de NTE-02 sur les familles n'a pas disparu.\",\"Mes propositions pour le Product Backlog sont des propositions, que Yann décidera.\"]},{\"id\":\"M5\",\"titre\":\"Répéter une conversation difficile\",\"duree\":20,\"badge\":{\"nom\":\"Diplomate\",\"devise\":\"Je m'entraîne avant la vraie conversation.\"},\"lien\":\"/sm/m5-conversation-difficile\",\"exercice\":{\"id\":\"SM.M5\",\"seul\":false,\"fichiers\":[\"situation-ajout-en-cours-de-sprint.md\"],\"checkpoint\":\"Écris la formulation que tu réutiliserais pour dire à Céline que tu n'ajoutes pas toi-même sa demande, et ce que tu lui proposes à la place.\"},\"grille\":[\"Le personnage de Céline est crédible, pas une caricature.\",\"Céline n'a pas cédé à la première objection.\",\"Je n'ai promis aucun ajout au sprint : la décision revient à Yann et aux développeurs.\",\"J'ai noté au moins 3 formulations à réutiliser, et une proposition d'alternative.\",\"J'ai pris le retour de l'IA pour un avis sur mes formulations, pas sur moi.\"]},{\"id\":\"M6\",\"titre\":\"Lire les métriques et accompagner l'usage de l'IA\",\"duree\":25,\"badge\":{\"nom\":\"Éclaireur\",\"devise\":\"Une courbe, des questions, pas de verdict.\"},\"lien\":\"/sm/m6-metriques-adoption\",\"exercice\":{\"id\":\"SM.M6\",\"seul\":false,\"fichiers\":[\"cycle-time-sprints-12-17.csv\",\"sondage-usages-ia-equipe.md\"],\"checkpoint\":\"Quelle est la moyenne du cycle time médian sur les 6 sprints, et quelle règle de ton expérimentation laisses-tu à l'équipe de décider ?\"},\"grille\":[\"J'ai décrit des tendances et des hypothèses à vérifier, aucun verdict.\",\"Aucune personne et aucune équipe n'est comparée.\",\"J'ai recalculé la moyenne moi-même avant de la reprendre.\",\"Aucune cause n'est affirmée sans source : chaque cause est une question pour l'équipe.\",\"L'expérimentation a un objectif, une durée, un critère de succès et des règles proposées à l'équipe.\"]}]}]}},\"locales\":{},\"scrollOffset\":134,\"cleanUrls\":true}");</script>
