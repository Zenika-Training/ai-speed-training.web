<style>
/* Calendrier de l'avent : 24 portes mélangées (ordre fixe), chacune cache une capsule.
   Même langage visuel qu'avant : fond nuit + particules, cartes voilées, chiffres en contour or.
   Toutes les portes sont ouvrables quel que soit le jour. ?debug : rien n'est mémorisé. */
html, body { background: var(--ink); color: var(--paper); }
body { margin: 0; font-family: var(--body); font-size: 16px; -webkit-font-smoothing: antialiased; }
#field {
  position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; display: block;
  background: radial-gradient(ellipse 80% 70% at 75% 10%, var(--navy), var(--ink) 70%);
}
#fx { position: fixed; inset: 0; z-index: 20; width: 100%; height: 100%; pointer-events: none; }
.wrap {
  position: relative; z-index: 1; max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(40px + env(safe-area-inset-top, 0px)) 64px;
  display: flex; flex-direction: column; gap: 48px;
}
.kicker { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }

header.hero { display: flex; flex-direction: column; gap: 20px; padding-top: 4vh; }
header.hero h1 {
  margin: 0 0 .08em; font-family: var(--display); font-weight: 900; letter-spacing: -.045em; line-height: .9;
  font-size: clamp(52px, 10.5vw, 148px);
}
header.hero h1 span { color: var(--accent); }
.lead { margin: 0; max-width: 44ch; font-size: 18px; line-height: 1.55; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 12px 40px; padding-top: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; color: var(--paper); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

.status { border-top: 1px solid var(--line); padding-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; min-height: 20px; }
.status p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.status p b { color: var(--accent); font-weight: 600; }
.debug { display: none; gap: 8px; align-items: center; }
.debug.on { display: flex; }
.debug em { font-style: normal; font: 600 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: var(--accent); padding: 6px 8px; border-radius: 2px; }
.debug button {
  font: 500 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 2px; padding: 10px 14px; cursor: pointer;
}
.debug button:hover { color: var(--paper); border-color: var(--muted); }

/* ---------- Portes ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 20px; }
.door { position: relative; perspective: 900px; display: grid; min-width: 0; }
.door.shake { animation: nope .45s cubic-bezier(.36, .07, .19, .97); }
@keyframes nope { 15%, 85% { transform: translateX(-3px); } 30%, 70% { transform: translateX(6px); } 50% { transform: translateX(-6px); } }

/* Derrière la porte : la capsule */
.inside {
  position: relative; min-height: 320px; display: flex; flex-direction: column; gap: 12px; padding: 22px 22px 18px;
  border: 1px solid var(--line); border-radius: 2px; overflow: hidden;
  background: radial-gradient(ellipse 90% 70% at 50% 0%, rgba(209, 173, 120, .18), transparent 70%), var(--veil);
  color: inherit; text-decoration: none; transition: border-color .3s, transform .4s cubic-bezier(.2, .8, .2, 1);
}
.inside .n { font-family: var(--display); font-weight: 900; font-size: 56px; line-height: .8; letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 1.2px var(--accent); transition: color .3s; font-variant-numeric: tabular-nums; }
.inside h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.inside p { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--muted); }
.inside .meta { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.inside .arrow { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--accent); transition: transform .3s; }
a.inside:hover { border-color: var(--accent); transform: translateY(-3px); }
a.inside:hover .n { color: var(--accent); }
a.inside:hover .arrow { transform: translateX(4px); }
.inside.soon { align-items: center; justify-content: center; text-align: center; }
.inside.soon .n { font-size: 72px; }

/* Le battant */
.panel {
  position: absolute; inset: 0; margin: 0; padding: 0; cursor: pointer; color: inherit; font: inherit;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  border: 1px solid var(--line); border-radius: 2px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, .05), transparent 45%),
    linear-gradient(var(--surface), var(--surface));
  transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: border-color .3s, box-shadow .3s;
}
.panel::before { /* filet intérieur façon cadre de porte */
  content: ""; position: absolute; inset: 8px; border: 1px solid var(--line); border-radius: 1px; pointer-events: none;
}
.panel::after { /* poignée */
  content: ""; position: absolute; right: 14px; top: 50%; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); opacity: .5; transform: translateY(-50%);
}
.panel .num {
  font-family: var(--display); font-weight: 900; font-size: clamp(64px, 9vw, 96px); line-height: .8; letter-spacing: -.05em;
  color: transparent; -webkit-text-stroke: 1.5px var(--accent); font-variant-numeric: tabular-nums; transition: color .3s;
}
.panel .tag { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.door.ready .panel { border-color: rgba(209, 173, 120, .55); animation: pulse 2.6s ease-in-out infinite; }
.door.ready .panel:hover { border-color: var(--accent); }
.door.ready .panel:hover .num { color: var(--accent); }
.door.locked .panel { cursor: not-allowed; }
.door.locked .num { -webkit-text-stroke-color: rgba(209, 173, 120, .4); }
@keyframes pulse { 50% { box-shadow: 0 0 0 1px rgba(209, 173, 120, .25), 0 0 26px rgba(209, 173, 120, .22); } }
.panel:focus-visible, a.inside:focus-visible, footer a:focus-visible, .debug button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Porte ouverte : la carte a disparu, la capsule est visible */
.door.open .panel { opacity: 0; visibility: hidden; pointer-events: none; animation: none; box-shadow: none; }
/* Ouverture : la carte tremble de plus en plus fort, puis explose */
.door.open.opening .panel { opacity: 1; visibility: visible; animation: tremble 1.5s linear forwards; }
@keyframes tremble {
  0% { transform: none; }
  4.0% { transform: translate(0.6px, -0.2px) rotate(-0.11deg) scale(1.002); box-shadow: 0 0 2px rgba(209, 173, 120, 0.03); border-color: var(--accent); }
  8.0% { transform: translate(-0.7px, 0.2px) rotate(0.12deg) scale(1.004); box-shadow: 0 0 3px rgba(209, 173, 120, 0.05); border-color: var(--accent); }
  12.0% { transform: translate(0.8px, 0.3px) rotate(-0.15deg) scale(1.005); box-shadow: 0 0 5px rgba(209, 173, 120, 0.07); border-color: var(--accent); }
  16.0% { transform: translate(-1.0px, -0.3px) rotate(0.19deg) scale(1.007); box-shadow: 0 0 7px rgba(209, 173, 120, 0.10); border-color: var(--accent); }
  20.0% { transform: translate(1.2px, 0.4px) rotate(-0.23deg) scale(1.009); box-shadow: 0 0 9px rgba(209, 173, 120, 0.12); border-color: var(--accent); }
  24.0% { transform: translate(-1.4px, 0.5px) rotate(0.29deg) scale(1.011); box-shadow: 0 0 10px rgba(209, 173, 120, 0.15); border-color: var(--accent); }
  28.0% { transform: translate(1.7px, -0.6px) rotate(-0.36deg) scale(1.013); box-shadow: 0 0 12px rgba(209, 173, 120, 0.18); border-color: var(--accent); }
  32.0% { transform: translate(-2.1px, 0.7px) rotate(0.44deg) scale(1.015); box-shadow: 0 0 14px rgba(209, 173, 120, 0.20); border-color: var(--accent); }
  36.0% { transform: translate(2.4px, 0.9px) rotate(-0.54deg) scale(1.016); box-shadow: 0 0 16px rgba(209, 173, 120, 0.23); border-color: var(--accent); }
  40.0% { transform: translate(-2.9px, -1.0px) rotate(0.64deg) scale(1.018); box-shadow: 0 0 17px rgba(209, 173, 120, 0.25); border-color: var(--accent); }
  44.0% { transform: translate(3.4px, 1.2px) rotate(-0.75deg) scale(1.020); box-shadow: 0 0 19px rgba(209, 173, 120, 0.28); border-color: var(--accent); }
  48.0% { transform: translate(-3.9px, 1.4px) rotate(0.87deg) scale(1.022); box-shadow: 0 0 21px rgba(209, 173, 120, 0.30); border-color: var(--accent); }
  52.0% { transform: translate(4.4px, -1.6px) rotate(-1.01deg) scale(1.024); box-shadow: 0 0 22px rgba(209, 173, 120, 0.33); border-color: var(--accent); }
  56.0% { transform: translate(-5.1px, 1.8px) rotate(1.15deg) scale(1.025); box-shadow: 0 0 24px rgba(209, 173, 120, 0.35); border-color: var(--accent); }
  60.0% { transform: translate(5.7px, 2.0px) rotate(-1.31deg) scale(1.027); box-shadow: 0 0 26px rgba(209, 173, 120, 0.38); border-color: var(--accent); }
  64.0% { transform: translate(-6.4px, -2.2px) rotate(1.48deg) scale(1.029); box-shadow: 0 0 28px rgba(209, 173, 120, 0.40); border-color: var(--accent); }
  68.0% { transform: translate(7.2px, 2.5px) rotate(-1.65deg) scale(1.031); box-shadow: 0 0 29px rgba(209, 173, 120, 0.43); border-color: var(--accent); }
  72.0% { transform: translate(-8.0px, 2.8px) rotate(1.84deg) scale(1.033); box-shadow: 0 0 31px rgba(209, 173, 120, 0.45); border-color: var(--accent); }
  76.0% { transform: translate(8.8px, -3.1px) rotate(-2.04deg) scale(1.035); box-shadow: 0 0 33px rgba(209, 173, 120, 0.48); border-color: var(--accent); }
  80.0% { transform: translate(-9.7px, 3.4px) rotate(2.25deg) scale(1.036); box-shadow: 0 0 35px rgba(209, 173, 120, 0.50); border-color: var(--accent); }
  84.0% { transform: translate(10.6px, 3.7px) rotate(-2.47deg) scale(1.038); box-shadow: 0 0 36px rgba(209, 173, 120, 0.53); border-color: var(--accent); }
  88.0% { transform: translate(-11.6px, -4.1px) rotate(2.70deg) scale(1.040); box-shadow: 0 0 38px rgba(209, 173, 120, 0.55); border-color: var(--accent); }
  94% { transform: scale(1.07); box-shadow: 0 0 60px rgba(255, 240, 200, .9); border-color: var(--accent-hi); filter: brightness(1.6); }
  100% { transform: scale(1.4); opacity: 0; filter: brightness(3); }
}
.door .flash {
  position: absolute; inset: -30%; pointer-events: none; opacity: 0; z-index: 2;
  background: radial-gradient(circle, rgba(255, 240, 200, .95) 0%, rgba(209, 173, 120, .55) 25%, transparent 60%);
}
.door.opening .flash { animation: flash 1s ease-out 1.4s both; }
@keyframes flash { 0% { opacity: 0; transform: scale(.3); } 18% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
.door.opening .inside { animation: surge 2.2s cubic-bezier(.2, .9, .2, 1.2) both; }
@keyframes surge { 0%, 67% { opacity: 0; transform: scale(.96); filter: brightness(.7); } 68% { opacity: 1; transform: scale(.96); filter: brightness(1.2); } 74% { transform: scale(1.07); filter: brightness(1.8); } 100% { transform: scale(1); filter: none; } }
.door.opening { z-index: 3; }
body.boom .wrap { animation: boom .5s cubic-bezier(.36, .07, .19, .97); }
@keyframes boom { 20% { transform: translate(2px, -2px); } 40% { transform: translate(-3px, 1px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(-1px, -1px); } }

footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
footer a { color: var(--muted); text-underline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .panel, .inside, .inside .n, .inside .arrow { transition: none; }
  .door.ready .panel, .door.shake, .door.opening .flash, .door.opening .inside, body.boom .wrap { animation: none; }
}
</style>

<script>
(function () {
  const DOORS = 24;
  const DEBUG = new URLSearchParams(location.search).has("debug");
  const list = (window.CAPSULES || []).slice();
  const byNum = new Map(list.map(c => [c.numero, c]));
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const grid = document.getElementById("grid"), msg = document.getElementById("msg");

  // Date du jour : une porte n'est ouvrable qu'en décembre, à partir de son jour.
  // Pour tester en conditions réelles avant décembre : ?mois=11 décale le calendrier sur novembre
  // (les portes s'ouvrent jour par jour selon la vraie date). Sans paramètre : décembre.
  const now = new Date();
  const mParam = parseInt(new URLSearchParams(location.search).get("mois"), 10);
  const M = mParam >= 1 && mParam <= 12 ? mParam - 1 : 11;           // index du mois (11 = décembre)
  const TEST = M !== 11;
  const NOMS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const ABR = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const MOIS = NOMS[M], MOIS_ABR = ABR[M];
  const KEY = "capsules-avent-" + now.getFullYear() + (TEST ? "-test-" + (M + 1) : "");   // mémoire séparée : ne pollue pas décembre
  const isOpenable = () => true;   // toutes les portes s'ouvrent, quel que soit le jour
  if (TEST) {
    document.querySelector(".hero .kicker").textContent = `24 portes · 1 capsule par jour · ${MOIS} (test)`;
    document.querySelector(".hero .lead").textContent = document.querySelector(".hero .lead").textContent.replace("décembre", MOIS);
  }

  // Mémoire des portes ouvertes (ignorée en debug : tout est refermé à chaque rafraîchissement).
  let opened = new Set();
  if (!DEBUG) { try { opened = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {} }
  const save = () => { if (!DEBUG) { try { localStorage.setItem(KEY, JSON.stringify([...opened])); } catch (e) {} } };

  // Ordre mélangé mais stable (graine fixe) : chaque visiteur voit le même calendrier.
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = mulberry(2412);
  const order = Array.from({ length: DOORS }, (_, i) => i + 1);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

  function inside(n) {
    const c = byNum.get(n);
    if (!c) return `<div class="inside soon" inert><div class="n">${pad(n)}</div><div class="kicker">Surprise</div><p>Une prochaine capsule se cache ici.</p></div>`;
    return `<a class="inside" href="${esc(c.fichier)}" tabindex="-1">
      <div class="n">${pad(n)}</div>
      <div class="kicker">${esc(c.theme)}</div>
      <h2>${esc(c.titre)}</h2>
      <p>${esc(c.accroche)}</p>
      <div class="meta"><span>${c.pages} pages · ${esc(c.duree)}</span><span class="arrow" aria-hidden="true">→</span></div>
    </a>`;
  }

  grid.innerHTML = order.map(n => `
    <div class="door" data-n="${n}">
      ${inside(n)}
      <span class="flash"></span>
      <button class="panel" type="button" aria-label="Porte ${n}">
        <span class="num">${pad(n)}</span><span class="tag"></span>
      </button>
    </div>`).join("");

  function label(door) {
    const n = +door.dataset.n, isOpen = opened.has(n), ok = isOpenable(n);
    door.classList.toggle("open", isOpen);
    door.classList.toggle("locked", !ok && !isOpen);
    door.classList.toggle("ready", ok && !isOpen);
    const panel = door.querySelector(".panel"), inner = door.querySelector(".inside");
    panel.setAttribute("aria-hidden", isOpen);
    panel.tabIndex = isOpen ? -1 : 0;
    panel.setAttribute("aria-label", isOpen ? `Porte ${n} ouverte` : ok ? `Ouvrir la porte ${n}` : `Porte ${n} verrouillée, ouverture le ${n} ${MOIS}`);
    panel.querySelector(".tag").textContent = isOpen ? "" : ok ? "Ouvrir" : `${n} ${MOIS_ABR}`;
    if (inner.tagName === "A") inner.tabIndex = isOpen ? 0 : -1;
    if (isOpen) inner.removeAttribute("aria-hidden"); else inner.setAttribute("aria-hidden", "true");
  }
  function refresh() {
    grid.querySelectorAll(".door").forEach(label);
    const stats = [[opened.size, "portes ouvertes"], [DOORS - opened.size, "à ouvrir"], [list.length, list.length > 1 ? "capsules" : "capsule"]];
    document.getElementById("stats").innerHTML = stats.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
    if (DEBUG) msg.innerHTML = "Mode test : toutes les portes s'ouvrent, rien n'est mémorisé.";
    else msg.innerHTML = "Toutes les portes sont ouvrables : ouvrez-les dans l'ordre de votre choix.";
  }

  // ---------- Effet d'ouverture : explosion de particules or + onde de choc ----------
  const fx = document.getElementById("fx"), fctx = fx.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const base = css.getPropertyValue("--particle").trim(), gold = css.getPropertyValue("--accent").trim(), hi = css.getPropertyValue("--accent-hi").trim(), paper = css.getPropertyValue("--paper").trim();
  let FW, FH, sparks = [], rings = [], fxOn = false;
  function fxSize() { const d = Math.min(devicePixelRatio, 2); FW = innerWidth; FH = innerHeight; fx.width = FW * d; fx.height = FH * d; fctx.setTransform(d, 0, 0, d, 0, 0); }
  function burst(x, y) {
    const cols = [gold, hi, paper, base];
    for (let i = 0; i < 160; i++) {
      const a = Math.random() * 6.283, v = 3 + Math.random() * 11;
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, r: .8 + Math.random() * 2.6, life: 1, d: .012 + Math.random() * .016, c: cols[(Math.random() * cols.length) | 0], star: Math.random() < .25 });
    }
    rings.push({ x, y, r: 10, a: 1 }, { x, y, r: 4, a: .7 });
    if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); }
  }
  function fxLoop() {
    fctx.clearRect(0, 0, FW, FH);
    for (const g of rings) {
      g.r += 11; g.a *= .93;
      fctx.globalAlpha = g.a; fctx.strokeStyle = gold; fctx.lineWidth = 2;
      fctx.beginPath(); fctx.arc(g.x, g.y, g.r, 0, 6.283); fctx.stroke();
    }
    rings = rings.filter(g => g.a > .03);
    for (const p of sparks) {
      p.vx *= .97; p.vy = p.vy * .97 + .18; p.x += p.vx; p.y += p.vy; p.life -= p.d;
      fctx.globalAlpha = Math.max(p.life, 0); fctx.fillStyle = p.c;
      if (p.star) { fctx.fillRect(p.x - p.r * 2, p.y - .5, p.r * 4, 1); fctx.fillRect(p.x - .5, p.y - p.r * 2, 1, p.r * 4); }
      else { fctx.beginPath(); fctx.arc(p.x, p.y, p.r, 0, 6.283); fctx.fill(); }
    }
    sparks = sparks.filter(p => p.life > 0);
    if (sparks.length || rings.length) requestAnimationFrame(fxLoop); else { fxOn = false; fctx.clearRect(0, 0, FW, FH); }
  }
  fxSize(); addEventListener("resize", fxSize);

  function openDoor(door) {
    const n = +door.dataset.n;
    if (opened.has(n)) return;
    if (!isOpenable(n)) {
      door.classList.remove("shake"); void door.offsetWidth; door.classList.add("shake");
      msg.innerHTML = `Patience : la porte <b>${n}</b> s'ouvrira le <b>${n} ${MOIS}</b>.`;
      return;
    }
    opened.add(n); save();
    if (!reduce) {
      door.classList.add("opening");
      const r = door.getBoundingClientRect();
      setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2), 1500);
      setTimeout(() => document.body.classList.add("boom"), 1500);
      setTimeout(() => document.body.classList.remove("boom"), 2020);
      setTimeout(() => door.classList.remove("opening"), 2300);
    }
    label(door); refresh();
  }
  grid.addEventListener("click", e => { const p = e.target.closest(".panel"); if (p) openDoor(p.closest(".door")); });
  grid.querySelectorAll(".door.open").forEach(d => d.classList.add("instant"));
  requestAnimationFrame(() => requestAnimationFrame(() => grid.querySelectorAll(".instant").forEach(d => d.classList.remove("instant"))));

  if (DEBUG) {
    document.getElementById("debug").classList.add("on");
    document.getElementById("openAll").onclick = () => { grid.querySelectorAll(".door:not(.open)").forEach((d, i) => setTimeout(() => openDoor(d), i * 90)); };
    document.getElementById("closeAll").onclick = () => { opened.clear(); refresh(); };
  }
  refresh();

  // ---------- Champ de particules en fond ----------
  const cv = document.getElementById("field"), ctx = cv.getContext("2d");
  let W, H, P = [], mx = .5, my = .5;
  function size() {
    const dpr = Math.min(devicePixelRatio, 2);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 5200);
    P = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .3 + Math.random() * .7, s: Math.random() * 6.28, g: Math.random() < .08 }));
  }
  addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; }, { passive: true });
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const sy = scrollY * .15;
    for (const p of P) {
      const x = (p.x + Math.sin(t * .0004 + p.s) * 14 * p.z + (mx - .5) * 30 * p.z + W) % W;
      const fall = reduce ? 0 : t * .025 * p.z; // chute lente, plus rapide pour les flocons proches
      const y = ((p.y + fall - sy * p.z) % H + H) % H;
      ctx.globalAlpha = p.g ? .9 : .25 + p.z * .35;
      ctx.fillStyle = p.g ? gold : base;
      ctx.beginPath(); ctx.arc(x, y, p.g ? 1.6 : .6 + p.z * .9, 0, 6.283); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", () => { size(); if (reduce) draw(0); });
  requestAnimationFrame(draw);
})();
</script>
