<script>
window.CAPSULE = {
  numero: 15,
  theme: "Usages et Méthodologie",
  titre: "Secrets et prompts",
  duree: "2 min",
  accroche: "Une clé d'API collée dans un prompt, un .env lu par l'agent : un secret quitte votre poste sans bruit. Où il fuit, et comment l'en empêcher.",
  pages: [
    {
      forme: { type: "libre", fn: (i, n, o) => {
        // Le poste (gauche) : fichiers lus (lavande) et un secret (or) ; tout part vers le modèle (droite).
        const q = i % 10, g = () => o.gauss() * .035;
        const ball = (cx, cy, r, acc) => { const u = o.rand() * 2 - 1, a = o.rand() * o.TAU, s = Math.sqrt(1 - u * u), k = r * Math.cbrt(o.rand()); return [cx + k * s * Math.cos(a), cy + k * u, k * s * Math.sin(a), acc]; };
        if (q < 3) return [-3 + o.rand() * 1.4, -1.6 + o.rand() * 3.2, (o.rand() - .5) * .5, 0];
        if (q < 4) return ball(-2.3, -.9, .22, 1);
        if (q < 6) return ball(2.4, 0, .7, 0);
        const t = o.rand(), sec = q === 9, y0 = sec ? -.9 : -1.4 + o.rand() * 2.8;
        return [-1.4 + 3.1 * t + g(), y0 * (1 - t) + g(), g(), sec ? 1 : 0];
      } },
      kicker: "Le principe",
      titre: "Tout ce que l'agent lit part vers le modèle",
      texte: "Un fichier ouvert, la sortie d'une commande, un log collé dans la conversation : tout entre dans le contexte et part chez le fournisseur du modèle. Un secret lu par l'agent a déjà quitté votre poste."
    },
    {
      forme: { type: "pile", feuilles: 24, accent: [23] },
      kicker: "L'ordre de grandeur", chiffre: "28,6 M",
      titre: "de secrets ajoutés en clair sur GitHub public en 2025",
      texte: "Clés d'API, mots de passe, jetons : 28,65 millions de nouveaux secrets écrits en dur dans des commits publics en un an, 34 % de plus qu'en 2024. Les dépôts internes en contiennent environ six fois plus.",
      source: { label: "GitGuardian · State of Secrets Sprawl 2026", url: "https://blog.gitguardian.com/the-state-of-secrets-sprawl-2026/" }
    },
    {
      forme: { type: "barres", valeurs: [1.5, 3.2], accent: [1] },
      kicker: "La comparaison", chiffre: "× 2",
      titre: "plus de fuites dans les commits faits avec un agent de code",
      texte: "Les commits assistés par Claude Code fuitent un secret dans 3,2 % des cas, contre 1,5 % pour l'ensemble des commits publics. GitGuardian l'attribue surtout aux choix humains : relecture rapide, pression du délai.",
      source: { label: "GitGuardian · State of Secrets Sprawl 2026", url: "https://blog.gitguardian.com/the-state-of-secrets-sprawl-2026/" }
    },
    {
      forme: { type: "frise", jalons: 3, accent: [0, 1, 2] },
      kicker: "L'exemple", chiffre: "3",
      titre: "fuites chez Samsung en moins de trois semaines",
      texte: "En mars 2023, juste après avoir autorisé ChatGPT, des ingénieurs de Samsung y ont collé du code source pour le corriger et des notes de réunion pour les résumer. Personne ne voulait fuiter : chacun voulait aller plus vite.",
      source: { label: "AI Incident Database · Incident 768 (2023)", url: "https://incidentdatabase.ai/cite/768/" }
    },
    {
      forme: { type: "dessin", vue: [100, 64], accent: [1], trait: 0, chemins: [
        "M8 4 h40 l12 12 v44 h-52 z",
        "M72 26 a10 10 0 1 0 0.01 0 z M80 36 l14 14 l-4 4 l-3 -3 l-3 3 l-3 -3 l-5 -5 z"
      ] },
      kicker: "Le piège", chiffre: "24 008",
      titre: "secrets trouvés dans des fichiers de configuration MCP publics",
      texte: "Pour brancher un agent sur un outil, on écrit souvent le jeton d'accès en clair dans le fichier de configuration MCP, puis on le commite. Parmi ces secrets, 2 117 fonctionnaient encore.",
      source: { label: "GitGuardian · State of Secrets Sprawl 2026", url: "https://blog.gitguardian.com/the-state-of-secrets-sprawl-2026/" }
    },
    {
      forme: { type: "grille", cols: 10, rows: 10, accent: 28 },
      kicker: "Hors du code", chiffre: "28 %",
      titre: "des fuites naissent hors du dépôt : Slack, Jira, Confluence",
      texte: "Un mot de passe collé dans un ticket pour débloquer un collègue y reste. Et un agent branché sur Jira par MCP le lit comme le reste du ticket, puis l'envoie au modèle avec sa tâche.",
      source: { label: "GitGuardian · State of Secrets Sprawl 2026", url: "https://blog.gitguardian.com/the-state-of-secrets-sprawl-2026/" }
    },
    {
      forme: { type: "texte", segments: [".env", "✕"], accent: [1] },
      kicker: "La parade",
      titre: "Interdisez à l'agent de lire vos fichiers de secrets",
      texte: "Dans Claude Code, une règle deny comme Read(./.env) dans .claude/settings.json bloque la lecture. Versionnée dans le dépôt, elle protège toute l'équipe. Gardez aussi les vrais secrets hors du dossier du projet.",
      source: { label: "Claude Code · Settings", url: "https://code.claude.com/docs/en/settings" }
    },
    {
      forme: { type: "barres", valeurs: [100, 70, 64], accent: [2] },
      kicker: "Le réflexe", chiffre: "64 %",
      titre: "des secrets valides fuités en 2022 marchaient encore en 2026",
      texte: "Testés valides en 2022 : 70 % l'étaient encore en janvier 2025, plus de 64 % en 2026. Effacer le message ou réécrire l'historique Git ne suffit pas : la copie est partie. Un secret exposé se révoque et se remplace, tout de suite.",
      source: { label: "GitGuardian · State of Secrets Sprawl 2026", url: "https://blog.gitguardian.com/the-state-of-secrets-sprawl-2026/" }
    }
  ],
  aRetenir: {
    titre: "Quatre réflexes",
    points: [
      "<b>Ne collez jamais un secret dans un prompt.</b> Remplacez-le par un faux avant d'envoyer un log ou un fichier.",
      "<b>Bloquez la lecture des .env.</b> Une règle deny versionnée protège toute l'équipe.",
      "<b>Sortez les jetons des configs MCP.</b> Passez par des variables d'environnement, jamais en clair dans un commit.",
      "<b>Révoquez dès qu'un secret a fuité.</b> L'effacer ne sert à rien, le changer protège."
    ]
  }
};
</script>
