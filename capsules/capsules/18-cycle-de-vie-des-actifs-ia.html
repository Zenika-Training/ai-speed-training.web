<html lang="fr">
<head>

<title>Vie d'un skill · Capsule IA 18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Red+Hat+Display:wght@500;700;900&display=swap">

<body>
<script>
window.CAPSULE = {
  numero: 18,
  theme: "Usages et Méthodologie",
  titre: "Vie d'un skill",
  duree: "2 min",
  accroche: "Prompts, skills, agents : une fois partagés, ils deviennent des actifs. Comme du code, ils naissent, servent, vieillissent et se retirent.",
  pages: [
    {
      forme: { type: "pictos", icones: ["bulle", "document", "engrenage"], accent: [1] },
      kicker: "Le principe",
      titre: "Un skill est une consigne réutilisable, partagée comme du code",
      texte: "Un prompt est une consigne donnée à l'IA. Un skill rassemble les consignes qu'un agent applique pour une tâche précise, comme qualifier une demande. Partagé entre équipes, il devient un actif à gérer."
    },
    {
      forme: { type: "libre", fn: (i, n, o) => {
        // Les 5 états (or) posés sur une ligne qui descend doucement : l'actif vieillit.
        const q = i % 10, t = o.rand(), y = (x) => .9 - (x + .9) * .38;
        if (q < 3) { const x = -.9 + t * 3.8; return [x + o.gauss() * .02, y(x) + o.gauss() * .02, o.gauss() * .02, 0]; }
        const k = Math.floor(i / 10) % 5, cx = -.9 + k * .95, u = o.rand() * 2 - 1, a = o.rand() * o.TAU, s = Math.sqrt(1 - u * u), r = .26 * Math.cbrt(o.rand());
        return [cx + r * s * Math.cos(a), y(cx) + r * u, r * s * Math.sin(a), 1];
      } },
      kicker: "Le cycle", chiffre: "5",
      titre: "états : brouillon, actif, périmé, retiré, remplacé",
      texte: "Chaque prompt, skill ou agent partagé passe par ces étapes. Le même cycle vaut pour le contexte et pour les specs : tout ce que lisent les agents vieillit et doit être revalidé un jour."
    },
    {
      forme: { type: "dessin", vue: [96, 60], accent: [1], trait: 0, chemins: [
        "M4 6 h66 l22 24 l-22 24 h-66 z",
        "M12 34 h48 v9 h-48 z"
      ] },
      kicker: "La carte d'identité",
      titre: "Un actif partagé a toujours un propriétaire et une date de validation",
      texte: "Son niveau (entreprise, programme ou équipe), son registre, son propriétaire et la date de sa dernière validation l'accompagnent. Sans propriétaire nommé, personne ne sait qui le corrige quand il dérive."
    },
    {
      forme: { type: "libre", fn: (i, n, o) => {
        // En bas, les brouillons épars de chaque équipe (lavande) ; quelques-uns passent la barre de promotion vers l'étagère partagée (or).
        const q = i % 20, t = o.rand(), g = (w) => o.gauss() * w;
        const ball = (cx, cy, r, acc) => { const u = o.rand() * 2 - 1, a = o.rand() * o.TAU, s = Math.sqrt(1 - u * u), k = r * Math.cbrt(o.rand()); return [cx + k * s * Math.cos(a), cy + k * u, k * s * Math.sin(a), acc]; };
        if (q < 10) { const k = Math.floor(i / 20) % 12; return ball(-2.75 + (k % 6) * 1.1, -2 + Math.floor(k / 6) * .75 + ((k * 37) % 10) / 30, .17, 0); }
        if (q < 12) return [-2.9 + t * 5.8, .15 + g(.02), g(.05), 0];
        if (q < 14) return [g(.07), -.75 + t * 2, g(.07), 1];
        const k = Math.floor(i / 20) % 4; return ball(-1.65 + k * 1.1, 1.65, .27, 1);
      } },
      kicker: "La promotion",
      titre: "Rien n'est gouverné tant que ce n'est pas promu ou déprécié",
      texte: "Un brouillon reste local à une équipe : libre, mais invisible des autres. Son passage au partage, la promotion, suit des critères fixés par un responsable, le Capability Librarian, qui tient la bibliothèque de skills."
    },
    {
      forme: { type: "dessin", vue: [66, 60], accent: "tout", trait: 4, chemins: [
        "M47.6 10.4 A22 22 0 1 0 53.7 33.8",
        "M45 32 L53.7 23 L62 32"
      ] },
      kicker: "Le piège",
      titre: "Aucun changement de skill sans rejeu sur des cas réels",
      texte: "Modifier une consigne change le comportement de tous les agents qui l'utilisent. Chaque changement de prompt, de skill ou de modèle est d'abord rejoué sur des traces de production ; il n'est retenu que s'il fait mieux."
    },
    {
      forme: { type: "libre", fn: (i, n, o) => {
        // Le contexte de l'agent (cadre, lavande) et ses actifs ; l'actif périmé (or) en est sorti, sans être détruit.
        const q = i % 10, t = o.rand();
        const ball = (cx, cy, r, acc) => { const u = o.rand() * 2 - 1, a = o.rand() * o.TAU, s = Math.sqrt(1 - u * u), k = r * Math.cbrt(o.rand()); return [cx + k * s * Math.cos(a), cy + k * u, k * s * Math.sin(a), acc]; };
        if (q < 3) { const e = Math.floor(o.rand() * 4), X = [-2.9, .5], Y = [-1.7, 1.7], z = o.gauss() * .12;
          if (e < 2) return [X[0] + t * (X[1] - X[0]), Y[e], z, 0];
          return [X[e - 2], Y[0] + t * (Y[1] - Y[0]), z, 0]; }
        if (q < 7) { const C = [[-2, .8], [-.6, .8], [-2, -.8], [-.6, -.8], [-1.3, 0]][Math.floor(i / 10) % 5]; return ball(C[0], C[1], .3, 0); }
        return ball(2.1, 0, .45, 1);
      } },
      kicker: "Le périmé",
      titre: "Périmé, un actif est signalé, pas supprimé",
      texte: "Au-delà d'un délai fixé sans revalidation, l'actif est marqué périmé. Il reste consultable, mais sort des consignes permanentes de l'agent et de sa recherche documentaire jusqu'à ce qu'un responsable le revalide."
    },
    {
      forme: { type: "texte", segments: ["RÔLE"], accent: "tout" },
      kicker: "La propriété",
      titre: "Un actif appartient à un rôle, pas à une personne",
      texte: "Quand quelqu'un change de poste, l'actif garde un responsable : c'est le rôle qui en répond, et la responsabilité passe avec lui. Sinon, un seul départ suffit à rendre un skill orphelin."
    },
    {
      forme: { type: "dessin", vue: [118, 50], accent: [2], trait: 0, chemins: [
        "M4 4 h26 l10 10 v32 h-36 z",
        "M50 20 h12 v-7 l12 12 l-12 12 v-7 h-12 z",
        "M82 4 h26 l10 10 v32 h-36 z"
      ] },
      kicker: "Le retrait",
      titre: "Retiré ou remplacé, un actif laisse toujours un chemin",
      texte: "Un actif est retiré à une date fixée, avec un responsable et un chemin de migration. Remplacé, il garde le lien vers son successeur. Même règle pour un modèle d'IA qui n'est plus appelé depuis longtemps."
    }
  ],
  aRetenir: {
    titre: "Quatre réflexes",
    points: [
      "<b>Promouvez ce qui sert.</b> Un bon prompt resté local ne profite qu'à son équipe.",
      "<b>Nommez un propriétaire.</b> Un actif partagé a un rôle responsable et une date de validation.",
      "<b>Rejouez avant de changer.</b> Testez chaque modification sur des cas réels avant de la diffuser.",
      "<b>Retirez proprement.</b> Une date, un responsable, un chemin vers le remplaçant."
    ]
  }
};
</script>
