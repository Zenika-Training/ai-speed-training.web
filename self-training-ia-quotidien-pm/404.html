nvaincre) : ce que l'IA peut faire pour toi, et ce qui reste ta décision.\",\"prerequis\":\"Être Product Manager en poste. Recommandé, sans être obligatoire, d'avoir suivi l'auto-formation « L'IA au quotidien » pour les Product Owners.\",\"requiert\":null,\"duree\":240,\"finAussi\":\"Dès ta prochaine décision de portefeuille : demande à l'IA de jouer le contradicteur avant de jouer le rédacteur, recalcule les chiffres qui comptent, et écris noir sur blanc ce que tu ne sais pas.\",\"dir\":\"pm\",\"modules\":[{\"id\":\"M0\",\"titre\":\"Démarrage : du PO au PM, ce qui change avec l'IA\",\"duree\":10,\"badge\":{\"nom\":\"Premier pas\",\"devise\":\"Je tranche, l'IA prépare.\"},\"lien\":\"/pm/m0-demarrage\",\"exercice\":{\"id\":\"PM.M0\",\"seul\":true,\"fichiers\":[],\"checkpoint\":\"Quelle tâche as-tu hésité à classer, et qu'est-ce qui t'a fait trancher ?\"},\"grille\":[\"Les tâches 3, 5 et 8 sont dans « je tranche ».\",\"Pour chaque tâche que je tranche, je sais quelle matière l'IA peut préparer.\",\"Les tâches 1, 4 et 7 sont dans « l'IA rédige, je vérifie », avec une vérification prévue.\",\"Les tâches 2 et 6 sont dans « l'IA propose, je choisis ».\"]},{\"id\":\"M1\",\"titre\":\"Veille marché et concurrence, avec des sources vérifiables\",\"duree\":30,\"bloc\":\"Comprendre\",\"badge\":{\"nom\":\"Veilleur\",\"devise\":\"Une case sans source reste vide.\"},\"lien\":\"/pm/m1-veille-marche\",\"exercice\":{\"id\":\"PM.M1\",\"seul\":false,\"fichiers\":[\"etude-tendances-et-avis.md\",\"fiches-concurrents-ABC.md\"],\"checkpoint\":\"Combien de cases de ta grille sont « non documenté », et l'IA en avait-elle rempli certaines ?\"},\"grille\":[\"Chaque case cite une source et une date, ou dit « non documenté ».\",\"La clé mobile de B est « annoncée », pas déployée.\",\"Chaque chiffre du baromètre garde son échantillon et sa date.\",\"Le contre-signal des familles est dans mes enseignements.\",\"Je n'ai rien ajouté qui ne vienne des documents.\"]},{\"id\":\"M2\",\"titre\":\"Discovery à grande échelle : des centaines de retours aux opportunités\",\"duree\":30,\"bloc\":\"Comprendre\",\"badge\":{\"nom\":\"Explorateur\",\"devise\":\"Je recompte avant de croire.\"},\"lien\":\"/pm/m2-discovery\",\"exercice\":{\"id\":\"PM.M2\",\"seul\":false,\"fichiers\":[\"questionnaire-apres-sejour-60.csv\"],\"checkpoint\":\"Pour le thème « facture et note », quel nombre l'IA a-t-elle donné, et quel nombre trouves-tu en recomptant les identifiants ?\"},\"grille\":[\"J'ai recompté au moins deux thèmes avec leurs identifiants.\",\"J'ai dit d'où viennent les réponses : hôtels, profils.\",\"Le signal faible sur l'accessibilité est gardé.\",\"Le contre-signal des familles est gardé.\",\"Aucune donnée personnelle n'est recopiée.\",\"Mes opportunités sont des besoins, pas des solutions.\"]},{\"id\":\"M3\",\"titre\":\"Vision et OKR : l'IA en contradicteur\",\"duree\":30,\"bloc\":\"Décider\",\"badge\":{\"nom\":\"Cap fixé\",\"devise\":\"Un effet, pas un livrable.\"},\"lien\":\"/pm/m3-vision-okr\",\"exercice\":{\"id\":\"PM.M3\",\"seul\":false,\"fichiers\":[\"orientations-portefeuille-sejour.md\",\"okr-brouillon-trimestre-suivant.md\"],\"checkpoint\":\"Lequel de tes résultats clés a une valeur de départ « non mesuré », et comment comptes-tu l'obtenir ?\"},\"grille\":[\"Chaque résultat clé mesure un effet, pas un livrable.\",\"Chacun dit sa source, sa période et son calcul.\",\"Les valeurs de départ manquantes sont « non mesuré », avec un moyen de les obtenir.\",\"Aucune cible n'est inventée.\",\"La santé technique est un garde-fou, pas un résultat clé.\"]},{\"id\":\"M4\",\"titre\":\"Business case : chiffrer la valeur sans inventer\",\"duree\":30,\"bloc\":\"Décider\",\"badge\":{\"nom\":\"Business case\",\"devise\":\"Pas de chiffre sans source.\"},\"lien\":\"/pm/m4-business-case\",\"exercice\":{\"id\":\"PM.M4\",\"seul\":false,\"fichiers\":[\"donnees-business-case-generalisation.md\"],\"checkpoint\":\"Quel montant en euros ton business case annonce-t-il, et d'où vient chaque valeur qui le compose ?\"},\"grille\":[\"J'ai recalculé au moins un scénario.\",\"Aucune valeur de mon business case n'est absente des données.\",\"Ma conclusion est en heures, et dit ce qui manque pour l'exprimer en euros.\",\"Les risques sur NTE-02 et sur les litiges sont écrits.\",\"Ma recommandation dit à qui je demande les chiffres manquants.\"]},{\"id\":\"M5\",\"titre\":\"Feuille de route et portefeuille : arbitrer, dire non, arrêter\",\"duree\":30,\"bloc\":\"Décider\",\"badge\":{\"nom\":\"Cartographe\",\"devise\":\"Le choix reste à toi.\"},\"lien\":\"/pm/m5-feuille-de-route\",\"exercice\":{\"id\":\"PM.M5\",\"seul\":false,\"fichiers\":[\"initiatives-trimestre-suivant.csv\",\"capacite-dependances-engagements.md\"],\"checkpoint\":\"Quelle promesse ton scénario renégocie-t-il, et que proposes-tu à la place ?\"},\"grille\":[\"Chaque scénario tient dans 5 sprints, avec son total.\",\"L'équipe Amarre n'est prévue qu'une fois, au sprint 2.\",\"I9 passe avant toute extension.\",\"Chaque scénario dit ce qu'on arrête ou repousse.\",\"La promesse de LAN-101 est renégociée, avec une proposition à la place.\",\"Le choix final est le mien, et je sais pourquoi.\"]},{\"id\":\"M6\",\"titre\":\"Après le lancement : généraliser, ajuster ou arrêter\",\"duree\":30,\"bloc\":\"Piloter\",\"badge\":{\"nom\":\"Lecteur de signaux\",\"devise\":\"Je mesure avant de conclure.\"},\"lien\":\"/pm/m6-apres-lancement\",\"exercice\":{\"id\":\"PM.M6\",\"seul\":false,\"fichiers\":[\"resultats-pilote-depart-express.csv\",\"promesses-lancement-depart-express.md\"],\"checkpoint\":\"Quelle part de départs express retiens-tu pour le pilote, et sur quel dénominateur ?\"},\"grille\":[\"Ma part du pilote est 17,1 %, sur les départs de LYS-03 seulement.\",\"Chaque promesse est jugée : tenue, non tenue, ou impossible à dire.\",\"Je n'attribue pas la baisse d'attente au départ express sans preuve.\",\"Les litiges et les frais après le départ sont dans ma conclusion.\",\"Ma décision est explicite, avec ce que je remesure et quand.\"]},{\"id\":\"M7\",\"titre\":\"Aligner et convaincre : note de décision, comité, annonce\",\"duree\":30,\"bloc\":\"Embarquer\",\"badge\":{\"nom\":\"Plume décisive\",\"devise\":\"Une note, une décision.\"},\"lien\":\"/pm/m7-note-de-decision\",\"exercice\":{\"id\":\"PM.M7\",\"seul\":false,\"fichiers\":[\"elements-note-revue-portefeuille.md\"],\"checkpoint\":\"Quelle inconnue ta note rend-elle visible, et à qui demandes-tu de la lever ?\"},\"grille\":[\"Ma note compare au moins deux options.\",\"La décision demandée tient en une phrase.\",\"Les inconnues sont visibles, et je sais à qui demander de les lever.\",\"Aucun superlatif.\",\"Aucun chiffre ni aucune date sans source.\",\"Chaque objection a une réponse appuyée sur la matière.\"]},{\"id\":\"M8\",\"titre\":\"Ancrer l'IA dans l'équipe produit\",\"duree\":20,\"bloc\":\"Embarquer\",\"badge\":{\"nom\":\"Passeur d'IA\",\"devise\":\"Une fiche, une équipe alignée.\"},\"lien\":\"/pm/m8-ancrer-ia-equipe\",\"exercice\":{\"id\":\"PM.M8\",\"seul\":false,\"fichiers\":[\"matiere-fiche-contexte-lanterne.md\"],\"checkpoint\":\"Quelles informations as-tu écartées de la fiche, et pour quelle raison chacune ?\"},\"grille\":[\"Ma fiche tient en une page.\",\"Chaque ligne a une source et une date, ou « non précisé ».\",\"Aucune règle périmée, aucune donnée personnelle, aucun secret.\",\"L'en-tête dit qui tient la fiche, et sa date de revue.\",\"Mes trois gabarits interdisent d'inventer.\"]}]}]}},\"locales\":{},\"scrollOffset\":134,\"cleanUrls\":true}");</script>
