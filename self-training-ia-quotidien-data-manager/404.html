\"link\":\"/dm/m1-arbitrer-demandes\"},{\"text\":\"M2 · Chiffrer la valeur d'un projet data\",\"link\":\"/dm/m2-chiffrer-valeur\"},{\"text\":\"M3 · Expliquer la facture cloud et préparer le budget\",\"link\":\"/dm/m3-facture-cloud\"}]},{\"text\":\"Gouverner\",\"items\":[{\"text\":\"M4 · Une définition, un data owner\",\"link\":\"/dm/m4-definition-data-owner\"},{\"text\":\"M5 · Préparer le passage d'un cas d'usage à la DPO\",\"link\":\"/dm/m5-passage-dpo\"}]},{\"text\":\"Faire grandir\",\"items\":[{\"text\":\"M6 · Accueillir une nouvelle recrue\",\"link\":\"/dm/m6-accueillir-recrue\"},{\"text\":\"M7 · Diffuser la culture data\",\"link\":\"/dm/m7-culture-data\"}]},{\"text\":\"Rendre compte\",\"items\":[{\"text\":\"M8 · Rendre compte à la direction\",\"link\":\"/dm/m8-rendre-compte\"}]},{\"text\":\"Fin\",\"items\":[{\"text\":\"Fin du parcours\",\"link\":\"/dm/fin\"}]}]},\"aside\":false,\"selfTraining\":{\"accueil\":{\"cle\":\"ia-data-manager-v1\",\"marque\":\"L'IA au quotidien\",\"surtitre\":\"Auto-formation · Data Manager\",\"titre\":\"L'IA au quotidien du Data Manager\",\"lede\":\"L'équipe Phare, ses demandes, son budget et ses données, mission après mission : l'IA prépare et contredit, toi tu décides.\",\"image\":\"/images/accueil.webp\",\"alt\":\"Le ou la Head of Data de l'équipe Phare (cheveux poivre et sel courts, lunettes rondes, pull bordeaux) se tient devant un grand tableau où des flux de données relient un hôtel, des graphiques et un phare stylisé ; une petite IA, un orbe magenta avec un visage, flotte à son épaule et pointe un chiffre entouré.\",\"etapes\":[\"Cette page te guide\",\"Ton assistant IA ouvert à côté\",\"Une mission, un créneau\"],\"pied\":[\"Documents fictifs. Ta progression reste dans ce navigateur.\"]},\"parcours\":[{\"id\":\"DM\",\"nom\":\"Parcours Data Manager\",\"titre\":\"L'IA dans le quotidien du Data Manager\",\"public\":\"Pour les responsables d'équipe data (Head of Data, data manager). Tu prends la tête de l'équipe Phare en quatre chapitres : décider (arbitrer les demandes, chiffrer la valeur, expliquer la facture cloud), gouverner (une définition et son data owner, le passage à la DPO), faire grandir (accueillir une recrue, diffuser la culture data), rendre compte à la direction.\",\"prerequis\":\"Diriger ou s'apprêter à diriger une équipe data. Aucun prérequis technique ; savoir lire un tableau de coûts et une note chiffrée.\",\"requiert\":null,\"duree\":240,\"finAussi\":\"Dès ta prochaine demande du métier : fais lister par l'IA ce qui manque pour l'évaluer, et pose toi-même la question au sponsor. Et avant d'envoyer un chiffre à la direction, refais le calcul à partir de la source.\",\"dir\":\"dm\",\"modules\":[{\"id\":\"M0\",\"titre\":\"Démarrage : travailler avec l'IA sans perdre la main\",\"duree\":15,\"badge\":{\"nom\":\"Premier cap\",\"devise\":\"Je décide, l'IA prépare.\"},\"lien\":\"/dm/m0-demarrage\",\"exercice\":{\"id\":\"DM.M0\",\"seul\":true,\"fichiers\":[],\"checkpoint\":\"Écris ta demande réécrite. Lequel des cinq réflexes as-tu eu le plus de mal à appliquer ?\"},\"grille\":[\"Ma demande donne un contexte précis et nomme les documents que je joins.\",\"Elle borne la tâche à une décision, pas à « la stratégie ».\",\"Elle fixe un format et une longueur.\",\"Elle interdit d'inventer des chiffres et demande les questions à poser.\",\"Elle ne délègue ni les priorités ni le budget.\"]},{\"id\":\"M1\",\"titre\":\"Arbitrer les demandes du métier\",\"duree\":30,\"bloc\":\"Décider\",\"badge\":{\"nom\":\"Arbitre\",\"devise\":\"Une demande se chiffre ou se questionne.\"},\"lien\":\"/dm/m1-arbitrer-demandes\",\"exercice\":{\"id\":\"DM.M1\",\"seul\":false,\"fichiers\":[\"demandes-metier-t1.md\",\"capacite-phare-t1.md\"],\"checkpoint\":\"Combien de jours sont demandés pour combien de jours libres ? Quelles demandes ne peuvent pas être évaluées telles quelles, et quelle question poses-tu à leur sponsor ?\"},\"grille\":[\"Je compare l'effort demandé (127 j estimés, plus deux demandes non chiffrées) aux 84 j libres.\",\"D3 et D7 sont signalées comme non évaluables, avec une question au sponsor sur la décision visée.\",\"D2 et D9 sont reconnues comme la même donnée à deux rythmes, à construire une seule fois.\",\"D6 est marquée « à passer à la DPO » avant tout engagement, et D4 dépendante du connecteur PMS v2.\",\"Les scénarios proposés tiennent dans la capacité, et le choix reste à faire avec les sponsors.\"]},{\"id\":\"M2\",\"titre\":\"Chiffrer la valeur d'un projet data\",\"duree\":30,\"bloc\":\"Décider\",\"badge\":{\"nom\":\"Calculateur\",\"devise\":\"Une hypothèse a une source ou un point d'interrogation.\"},\"lien\":\"/dm/m2-chiffrer-valeur\",\"exercice\":{\"id\":\"DM.M2\",\"seul\":false,\"fichiers\":[\"note-valeur-prevision-occupation.md\",\"hypotheses-operations.csv\"],\"checkpoint\":\"Quel gain annuel trouves-tu après correction, quel coût oublié ajoutes-tu, et quelle hypothèse ferais-tu mesurer avant de t'engager ?\"},\"grille\":[\"L'erreur de calcul est relevée : 2 × 40 × 365 × 22 = 642 400 €, pas 1 284 800 €.\",\"Le périmètre est ramené aux 12 hôtels qui ont le connecteur PMS v2 (192 720 € de gain brut par an).\",\"Le coût de fonctionnement est ajouté (cloud et maintenance, 46 600 € par an).\",\"Les « 2 heures par jour » sont signalées comme une estimation jamais mesurée, avec un scénario pessimiste.\",\"Ma recommandation (pilote mesuré ou non) est la mienne, et je sais l'expliquer à Karim.\"]},{\"id\":\"M3\",\"titre\":\"Expliquer la facture cloud et préparer le budget\",\"duree\":30,\"bloc\":\"Décider\",\"badge\":{\"nom\":\"Gardien du budget\",\"devise\":\"Une hausse s'explique ligne par ligne.\"},\"lien\":\"/dm/m3-facture-cloud\",\"exercice\":{\"id\":\"DM.M3\",\"seul\":false,\"fichiers\":[\"facture-cloud-phare-2026.csv\",\"changements-plateforme.md\"],\"checkpoint\":\"Quelles sont les deux causes principales de la hausse, combien chacune coûte par mois, et que décides-tu pour chacune ?\"},\"grille\":[\"La hausse est confirmée et chiffrée : 8 600 € en juillet, 12 280 € en octobre, + 3 680 € (+43 %).\",\"Les deux causes sont nommées : le bac à sable oublié (2 100 €) et le rafraîchissement toutes les 15 minutes (+1 400 € sur le calcul).\",\"Les licences BI inutilisées (38 sièges, 1 140 € par mois) sont signalées, avec l'engagement jusqu'au 30 juin 2027.\",\"Aucune économie ne touche aux sauvegardes (règle R7).\",\"La note à Bastien dit ce que je décide, ce que j'attends, et ce qui n'est pas encore sûr.\"]},{\"id\":\"M4\",\"titre\":\"Une définition, un data owner\",\"duree\":30,\"bloc\":\"Gouverner\",\"badge\":{\"nom\":\"Cartographe\",\"devise\":\"Une donnée, une définition, une personne qui en répond.\"},\"lien\":\"/dm/m4-definition-data-owner\",\"exercice\":{\"id\":\"DM.M4\",\"seul\":false,\"fichiers\":[\"chiffres-ca-octobre.md\",\"organisation-portefeuille.md\"],\"checkpoint\":\"D'où vient l'écart entre les trois chiffres ? Qui proposes-tu comme data owner du chiffre d'affaires, et pourquoi pas l'équipe Phare ?\"},\"grille\":[\"Les trois chiffres sont réconciliés : 4 990 000 − 170 000 = 4 820 000 € HT net ; × 1,10 sur le brut = 5 489 000 € TTC ; + 130 000 € de taxe de séjour = 4 950 000 €.\",\"La définition proposée dit ce qu'elle compte et ce qu'elle exclut (TVA, annulations, taxe de séjour).\",\"Le data owner proposé est la direction financière (Bastien), une seule personne qui répond de la donnée.\",\"Phare met en œuvre et contrôle ; le data steward est côté métier (contrôle de gestion).\",\"La définition reste une proposition à valider par Mathilde et Bastien, pas une décision de l'IA.\"]},{\"id\":\"M5\",\"titre\":\"Préparer le passage d'un cas d'usage à la DPO\",\"duree\":25,\"bloc\":\"Gouverner\",\"badge\":{\"nom\":\"Vigie\",\"devise\":\"Je prépare les questions, la DPO décide.\"},\"lien\":\"/dm/m5-passage-dpo\",\"exercice\":{\"id\":\"DM.M5\",\"seul\":false,\"fichiers\":[\"cas-usage-avis-clients.md\",\"politique-donnees-lanterne.md\"],\"checkpoint\":\"Quels sont les trois points que la DPO va soulever en premier, avec la règle de la politique pour chacun ?\"},\"grille\":[\"La nouvelle finalité (rappeler les clients mécontents) est relevée face à l'information donnée aux clients (R2).\",\"Les données inutiles (nom, numéro de chambre) et l'historique complet depuis 2021 sont signalés (R3, R4).\",\"L'outil non référencé, hébergé peut-être hors de l'Union européenne, est un point bloquant avant tout essai (R5).\",\"La question d'une analyse d'impact est posée à la DPO, avec les critères qui s'appliquent (R6).\",\"Mon dossier pose des questions et propose des ajustements ; il ne déclare pas le cas d'usage conforme.\"]},{\"id\":\"M6\",\"titre\":\"Accueillir une nouvelle recrue\",\"duree\":25,\"bloc\":\"Faire grandir\",\"badge\":{\"nom\":\"Passeur\",\"devise\":\"Ce qui n'est que dans une tête se transmet avant le départ.\"},\"lien\":\"/dm/m6-accueillir-recrue\",\"exercice\":{\"id\":\"DM.M6\",\"seul\":false,\"fichiers\":[\"notes-passation-hugo.md\",\"fiche-poste-data-engineer.md\"],\"checkpoint\":\"Quelles trois choses doivent être faites avant le départ de Hugo le 3 novembre, et pourquoi celles-là ?\"},\"grille\":[\"La migration de l'entrepôt, connue seulement de Hugo, est transmise et écrite avant le 3 novembre.\",\"Le mot de passe en clair dans le DAG est signalé comme un risque à traiter tout de suite (coffre de secrets, puis changement du mot de passe).\",\"L'ajout de Lou au canal d'alertes et le suivi des droits sur l'entrepôt sont dans la première semaine.\",\"Le plan des 30 jours suit la fiche de poste (run en binôme, un référent, un point par semaine).\",\"Le plan n'a aucune grille pour noter Lou ; ses priorités se fixent avec Lou.\"]},{\"id\":\"M7\",\"titre\":\"Diffuser la culture data\",\"duree\":30,\"bloc\":\"Faire grandir\",\"badge\":{\"nom\":\"Passeur de culture\",\"devise\":\"On forme à lire un chiffre, pas à cliquer.\"},\"lien\":\"/dm/m7-culture-data\",\"exercice\":{\"id\":\"DM.M7\",\"seul\":false,\"fichiers\":[\"enquete-usage-bi-operations.csv\"],\"checkpoint\":\"Quel est le premier blocage, combien de réponses le citent, et qui le cite ? Sur quoi portera ton atelier ?\"},\"grille\":[\"Les thèmes sont comptés et la somme fait 24 : confiance dans les chiffres 10, ne trouve pas 5, trop de tableaux ou pas le temps 4, export 3, accès 2.\",\"Je remarque que les 10 réponses sur la confiance viennent toutes des directions d'hôtel, celles qui utilisent les tableaux.\",\"Les trois demandes de « formation Power BI » sont lues comme un problème de confiance, pas d'outil.\",\"L'atelier porte sur lire un chiffre et savoir d'où il vient (avec la définition du CA), pas sur les clics.\",\"Les blocages simples (lien dans l'intranet, accès, export) sont traités sans atelier.\"]},{\"id\":\"M8\",\"titre\":\"Rendre compte à la direction\",\"duree\":25,\"bloc\":\"Rendre compte\",\"badge\":{\"nom\":\"Porte-parole\",\"devise\":\"La mauvaise nouvelle d'abord, avec son plan.\"},\"lien\":\"/dm/m8-rendre-compte\",\"exercice\":{\"id\":\"DM.M8\",\"seul\":false,\"fichiers\":[\"bilan-t4-phare.md\",\"rapport-t4-genere.md\"],\"checkpoint\":\"Combien d'écarts trouves-tu entre le brouillon et les notes ? Quelle mauvaise nouvelle mets-tu en premier dans ton rapport ?\"},\"grille\":[\"Les chiffres faux sont relevés : 4 livraisons sur 6, pas 6 ; 24 à 31 % d'adoption, pas 61,5 % (le chiffre de l'incident).\",\"Les affirmations sans source sont relevées : la satisfaction « +12 % » n'est pas mesurée ; la migration n'est pas « dans les temps ».\",\"Les oublis sont relevés : l'incident PHA-42, et l'arbitrage du T1 (le brouillon promet de prendre les neuf demandes).\",\"Le retard de la migration et le risque sur le 31 mars ouvrent mon rapport, avec le plan.\",\"J'ai préparé mes réponses aux questions difficiles de Mathilde, et je les ai répétées.\"]}]}]}},\"locales\":{},\"scrollOffset\":134,\"cleanUrls\":true}");</script>
