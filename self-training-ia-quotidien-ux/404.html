},{\"text\":\"M2 · Préparer une recherche utilisateur : guide d'entretien et recrutement\",\"link\":\"/ux/m2-preparer-recherche\"},{\"text\":\"M3 · Synthétiser des entretiens : verbatims, irritants, insights\",\"link\":\"/ux/m3-synthetiser-entretiens\"},{\"text\":\"M4 · Personas et parcours client (journey map) fondés sur les données\",\"link\":\"/ux/m4-personas-parcours\"},{\"text\":\"M5 · Explorer des solutions : idéation, flows et wireframes\",\"link\":\"/ux/m5-explorer-solutions\"},{\"text\":\"M6 · Écrire les contenus de l'interface (UX writing) et les états\",\"link\":\"/ux/m6-ux-writing\"},{\"text\":\"M7 · Vérifier l'accessibilité d'une maquette\",\"link\":\"/ux/m7-accessibilite\"},{\"text\":\"M8 · Préparer et analyser un test utilisateur\",\"link\":\"/ux/m8-test-utilisateur\"},{\"text\":\"M9 · Documenter et transmettre : specs de design, design system, handoff\",\"link\":\"/ux/m9-handoff\"}]},{\"text\":\"Fin\",\"items\":[{\"text\":\"Fin du parcours\",\"link\":\"/ux/fin\"}]}]},\"aside\":false,\"selfTraining\":{\"accueil\":{\"cle\":\"ia-ux-v2\",\"marque\":\"L'IA au quotidien\",\"surtitre\":\"Auto-formation · UX Designer\",\"titre\":\"L'IA au quotidien de l'UX designer\",\"lede\":\"Le départ express de Lanterne, du brief au handoff, mission après mission : l'IA prépare et contredit, toi tu décides.\",\"image\":\"/images/accueil.webp\",\"alt\":\"Le ou la designer UX de Lanterne (cheveux courts châtains ondulés, lunettes rondes, col roulé gris anthracite) dispose des wireframes de téléphone sur un bureau, devant un tableau de parcours ; une petite IA, un orbe magenta, l'aide à les ranger.\",\"etapes\":[\"Cette page te guide\",\"Ton assistant IA ouvert à côté\",\"Une mission, un créneau\"],\"pied\":[\"Documents fictifs. Ta progression reste dans ce navigateur.\"]},\"parcours\":[{\"id\":\"UX\",\"nom\":\"Parcours UX\",\"titre\":\"L'IA dans le quotidien de l'UX designer\",\"public\":\"Pour les UX designers et UX researchers en poste. Tu mènes le départ express de Lanterne en trois chapitres : comprendre (challenger le brief, préparer et synthétiser la recherche), donner forme (journey map, flows, textes), vérifier et livrer (accessibilité, test, handoff).\",\"prerequis\":\"Être UX designer ou UX researcher en poste. Aucun prérequis technique.\",\"requiert\":null,\"duree\":180,\"finAussi\":\"Dès ta prochaine demande : avant de dessiner, demande à l'IA de jouer le contradicteur et retrouve le problème derrière la solution. Dès ta prochaine synthèse d'entretiens : demande à l'IA de citer, pour chaque insight, les verbatims et les participants qui le portent, puis vérifie-les dans les transcriptions. Et avant de dire qu'une maquette est accessible, teste-la toi-même au clavier et avec un outil de contraste.\",\"dir\":\"ux\",\"modules\":[{\"id\":\"M0\",\"titre\":\"Démarrage : travailler avec l'IA sans perdre la main\",\"duree\":10,\"badge\":{\"nom\":\"Premier pas\",\"devise\":\"Je décide, l'IA m'assiste.\"},\"lien\":\"/ux/m0-demarrage\",\"exercice\":{\"id\":\"UX.M0\",\"seul\":true,\"fichiers\":[],\"checkpoint\":\"Écris ta demande réécrite. Lequel des cinq réflexes as-tu eu le plus de mal à appliquer ?\"},\"grille\":[\"Ma demande nomme la source des personas (la synthèse des entretiens) et seulement elle.\",\"Elle fixe le format et le nombre de personas attendus.\",\"Elle interdit d'inventer et demande, pour chaque trait, la source qui le porte.\",\"Elle ne délègue pas le choix du persona prioritaire.\",\"Je sais comment je vais vérifier la réponse.\"]},{\"id\":\"M1\",\"titre\":\"Challenger le brief\",\"duree\":20,\"badge\":{\"nom\":\"Avocat·e du diable\",\"devise\":\"Derrière chaque solution demandée, un problème à retrouver.\"},\"lien\":\"/ux/m1-challenger-brief\",\"exercice\":{\"id\":\"UX.M1\",\"seul\":false,\"fichiers\":[\"demande-initiale-depart-express.md\"],\"checkpoint\":\"Écris ton énoncé « Comment pourrions-nous… » et l'objectif de ta recherche. Quelle hypothèse de Céline testeras-tu en premier ?\"},\"grille\":[\"J'ai relevé au moins trois hypothèses implicites de la demande, dont « les clients veulent payer sur leur téléphone ».\",\"Mon énoncé « Comment pourrions-nous… » parle d'un problème du client, pas d'un écran.\",\"J'ai utilisé les chiffres du comptoir (contestations, file) et pas seulement le message.\",\"Mon objectif de recherche dit qui interroger et ce que l'on veut comprendre.\"]},{\"id\":\"M2\",\"titre\":\"Préparer une recherche utilisateur : guide d'entretien et recrutement\",\"duree\":20,\"badge\":{\"nom\":\"Enquêteur·rice\",\"devise\":\"Une bonne question demande un souvenir, pas un avis.\"},\"lien\":\"/ux/m2-preparer-recherche\",\"exercice\":{\"id\":\"UX.M2\",\"seul\":false,\"fichiers\":[\"brief-recherche-depart-express.md\",\"segments-clients-lanterne.md\"],\"checkpoint\":\"Combien d'entretiens ton plan prévoit-il, avec quels clients, et quelle question de ton guide pourrait orienter la réponse ?\"},\"grille\":[\"Chaque hypothèse du brief est reformulée de façon testable, et les conclusions déguisées sont repérées.\",\"Les questions du guide sont ouvertes et portent sur le vécu, pas sur un futur hypothétique.\",\"Le plan compte six entretiens au plus et le guide tient en 30 minutes.\",\"Les familles de NTE-02 sont recrutées.\",\"Les séjours exclus (DE-8) sont écartés, ou inclus en le disant.\"]},{\"id\":\"M3\",\"titre\":\"Synthétiser des entretiens : verbatims, irritants, insights\",\"duree\":20,\"badge\":{\"nom\":\"Chasseur·se d'insights\",\"devise\":\"Un insight se compte et se cite.\"},\"lien\":\"/ux/m3-synthetiser-entretiens\",\"exercice\":{\"id\":\"UX.M3\",\"seul\":false,\"fichiers\":[\"entretiens-clients-transcriptions.md\"],\"checkpoint\":\"Combien d'insights retiens-tu, combien de clients portent chacun, et quel signal as-tu écarté ?\"},\"grille\":[\"Chaque insight cite un verbatim exact, avec le client qui l'a dit.\",\"Le nombre de clients de chaque insight est juste.\",\"Le signal d'un seul client (payer en plusieurs fois) n'est pas devenu un insight.\",\"Je peux dire pourquoi je retiens chaque insight et quel poids je lui donne.\"]},{\"id\":\"M4\",\"titre\":\"Personas et parcours client (journey map) fondés sur les données\",\"duree\":20,\"badge\":{\"nom\":\"Cartographe du parcours\",\"devise\":\"Pas de preuve, pas d'émotion.\"},\"lien\":\"/ux/m4-personas-parcours\",\"exercice\":{\"id\":\"UX.M4\",\"seul\":false,\"fichiers\":[\"synthese-entretiens-v1.md\",\"donnees-usage-depart.csv\"],\"checkpoint\":\"Pour chaque émotion de ta journey map, quel verbatim (C1 à C6) ou quelle ligne du relevé la justifie ?\"},\"grille\":[\"Mes personas décrivent une situation et un besoin, avec sources ; aucun prénom, âge ni loisir inventé.\",\"Les familles de NTE-02 ont leur place : un persona ou, au minimum, leur moment dans le parcours.\",\"Chaque émotion de la journey map renvoie à un verbatim ou à une ligne du relevé ; sinon elle est notée « hypothèse ».\",\"Le paiement en plusieurs fois n'est pas une étape du parcours (C4 seul) : il reste un signal à confirmer.\"]},{\"id\":\"M5\",\"titre\":\"Explorer des solutions : idéation, flows et wireframes\",\"duree\":20,\"badge\":{\"nom\":\"Architecte des flows\",\"devise\":\"Je dessine large, puis je choisis.\"},\"lien\":\"/ux/m5-explorer-solutions\",\"exercice\":{\"id\":\"UX.M5\",\"seul\":false,\"fichiers\":[\"fiche-depart-express-v1.md\",\"lueur-3-2-composants.md\",\"croquis-idees-atelier.md\"],\"checkpoint\":\"Pour la direction que tu retiens, quel composant Lueur sert chaque écran, et que signales-tu à Maëlle ?\"},\"grille\":[\"Mes trois directions diffèrent par leur structure (nombre d'écrans, ordre, place de l'action qui engage), pas par leurs libellés.\",\"Le total et chaque ligne s'affichent avant l'action qui engage le client (DE-2), avec une seule action principale par écran.\",\"Je n'ai utilisé que des composants de Lueur 3.2 ; le champ de texte et la case à cocher sont signalés à Maëlle, pas inventés.\",\"Le minibar (DE-6) reste ouvert, et je dis pourquoi je retiens cette direction.\"]},{\"id\":\"M6\",\"titre\":\"Écrire les contenus de l'interface (UX writing) et les états\",\"duree\":15,\"badge\":{\"nom\":\"Plume de Lanterne\",\"devise\":\"Chaque mot est une promesse.\"},\"lien\":\"/ux/m6-ux-writing\",\"exercice\":{\"id\":\"UX.M6\",\"seul\":false,\"fichiers\":[\"ecrans-depart-express-v2.md\",\"charte-editoriale-lanterne.md\"],\"checkpoint\":\"Quelle promesse ou quel ton l'IA a-t-elle introduit dans ses textes, et la charte ou le produit les permet-il ?\"},\"grille\":[\"Aucun jargon (« note », pas « folio »), et le client est vouvoyé partout.\",\"Chaque message d'erreur dit ce qui s'est passé et ce que le client peut faire, sans code.\",\"Chaque libellé de bouton commence par un verbe d'action et tient dans la longueur maximale, comptée par moi.\",\"Rien n'est promis que le produit ne fait pas (remboursement, contestation acceptée).\"]},{\"id\":\"M7\",\"titre\":\"Vérifier l'accessibilité d'une maquette\",\"duree\":20,\"badge\":{\"nom\":\"Gardien·ne de l'accessibilité\",\"devise\":\"Un écart se relève, la conformité se prouve.\"},\"lien\":\"/ux/m7-accessibilite\",\"exercice\":{\"id\":\"UX.M7\",\"seul\":false,\"fichiers\":[\"maquette-depart-express-description.md\",\"criteres-accessibilite-extrait.md\"],\"checkpoint\":\"Qu'est-ce que ton assistant IA a affirmé sans pouvoir le vérifier à partir d'une description écrite ?\"},\"grille\":[\"Chaque constat cite un critère existant de l'extrait, avec son numéro et son niveau (A ou AA).\",\"Les ratios de contraste sont calculés, et je les ai recalculés avec un outil.\",\"Le critère de taille de cible est présenté au bon niveau (AAA), pas comme une exigence AA.\",\"Les points non vérifiables sur une description sont listés avec le test à faire.\",\"Aucun écran n'est déclaré « conforme » à ce stade.\"]},{\"id\":\"M8\",\"titre\":\"Préparer et analyser un test utilisateur\",\"duree\":20,\"badge\":{\"nom\":\"Observateur·rice\",\"devise\":\"Je décris une situation, jamais la réponse.\"},\"lien\":\"/ux/m8-test-utilisateur\",\"exercice\":{\"id\":\"UX.M8\",\"seul\":false,\"fichiers\":[\"protocole-test-v1.md\",\"notes-test-utilisateur.md\"],\"checkpoint\":\"Pour chaque problème, combien de participants sur six et quel impact justifient sa gravité ?\"},\"grille\":[\"Mes scénarios décrivent une situation, sans nommer un bouton ni donner la réponse.\",\"Chaque tâche a un critère de réussite que l'on peut observer.\",\"Chaque gravité est justifiée par un nombre de participants sur six et par un impact.\",\"Le problème vu par un seul participant reste présenté comme isolé.\",\"Mes citations sont celles des notes, et aucune solution n'apparaît avant le constat.\"]},{\"id\":\"M9\",\"titre\":\"Documenter et transmettre : specs de design, design system, handoff\",\"duree\":15,\"badge\":{\"nom\":\"Passeur·se de relais\",\"devise\":\"Ce qui est flou, les développeurs le devinent.\"},\"lien\":\"/ux/m9-handoff\",\"exercice\":{\"id\":\"UX.M9\",\"seul\":false,\"fichiers\":[\"ecrans-depart-express-v3.md\",\"lueur-3-2-composants.md\"],\"checkpoint\":\"Quels éléments de ta spec n'existent pas dans Lueur 3.2, et comment les présentes-tu aux développeurs ?\"},\"grille\":[\"Aucun composant hors Lueur 3.2 n'est décrit comme existant : le champ de texte et la case à cocher sont des besoins.\",\"Chaque écran couvre ses états (chargement, erreur, et vide quand il existe).\",\"Le minibar (DE-6) reste une question ouverte.\",\"Aucune règle métier n'est inventée.\",\"La demande à Maëlle s'appuie sur l'usage, et ce qui n'est pas documenté y est une question.\"]}]}]}},\"locales\":{},\"scrollOffset\":134,\"cleanUrls\":true}");</script>
